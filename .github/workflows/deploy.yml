## Project Sentinel - CI/CD Pipeline
## Triggers on push to main, runs tests, deploys to Render

name: CI/CD — Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ============================================================
  # JOB 1: Test
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Lint check (basic)
        run: |
          pip install flake8
          flake8 agents/ --max-line-length=120 --ignore=E501,W503 || true

      - name: Run unit tests
        env:
          # Use dummy keys for tests — real keys are never in CI
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_TEST }}
          GNEWS_API_KEY: dummy
          SUPABASE_URL: dummy
          SUPABASE_KEY: dummy
        run: |
          pytest tests/ -v --tb=short --cov=agents --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: .coverage

  # ============================================================
  # JOB 2: Deploy to Render (only on push to main, not PRs)
  # ============================================================
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test                           # Only deploy if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy — Dashboard
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DASHBOARD }}" \
            -H "Accept: application/json" | jq .
        continue-on-error: false

      - name: Trigger Render Deploy — Hive Worker
        run: |
          curl -s --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}" \
            -H "Accept: application/json" | jq .
        continue-on-error: false

      - name: Deployment Summary
        run: |
          echo "✅ Deployment triggered successfully!"
          echo "Dashboard: https://sentinel-dashboard.onrender.com"
          echo "Worker:    sentinel-hive-worker (background, no URL)"
          echo "Commit:    ${{ github.sha }}"
          echo "Author:    ${{ github.actor }}"

# ============================================================
# Required GitHub Secrets (set in repo Settings > Secrets):
#
# RENDER_DEPLOY_HOOK_DASHBOARD  — Render deploy hook URL for dashboard
# RENDER_DEPLOY_HOOK_WORKER     — Render deploy hook URL for hive worker
# GEMINI_API_KEY_TEST           — Optional: test API key (can leave blank)
#
# Get Render deploy hook URLs from:
#   Render Dashboard > sentinel-dashboard > Settings > Deploy Hook
# ============================================================
