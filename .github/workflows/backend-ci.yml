name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "agents/**"
      - "services/**"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "agents/**"
      - "services/**"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check (lint)
        run: ruff check backend/ agents/ services/ --select E,F,W --ignore E501,E402,W293,W291

      - name: Ruff format check
        run: ruff format --check backend/ agents/ services/ || true

  compile:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python files
        run: |
          python -m py_compile backend/main.py
          python -m py_compile agents/agent_service.py
          python -m py_compile agents/sentinel_hive.py
          python -m py_compile agents/sentinel_state.py
          python -m py_compile agents/langgraph_agents.py
          python -m py_compile agents/analyst_agent_gemini.py
          python -m py_compile agents/supervisor.py
          python -m py_compile agents/scout_agent.py
          python -m py_compile agents/analyst_agent.py
          python -m py_compile agents/risk_manager.py
          python -m py_compile agents/trader_agent.py
          python -m py_compile services/auth_manager.py
          python -m py_compile services/news_loader.py
          python -m py_compile services/broker_engine.py
          python -m py_compile services/database_manager.py
          python -m py_compile services/market_loader.py

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          TESTING: "1"
