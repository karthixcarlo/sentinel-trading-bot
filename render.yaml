services:

  # 1. Streamlit Dashboard (Web Service)
  - name: sentinel-dashboard
    type: web
    env: python
    region: singapore
    plan: starter
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run dashboard_v3/Home.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.10.12"

  # 2. LangGraph Autonomous Worker (Background Service)
  - name: sentinel-hive-worker
    type: worker
    env: python
    region: singapore
    plan: starter
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python run_autonomous.py
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: TZ
        value: "Asia/Kolkata"
