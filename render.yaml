## Project Sentinel - Render Blueprint
## Deploy both services from a single GitHub push
## Docs: https://render.com/docs/blueprint-spec

services:

  # ============================================================
  # 1. FRONTEND — Streamlit Dashboard
  # ============================================================
  - name: sentinel-dashboard
    type: web
    env: python
    region: singapore  # Closest to India (NSE/BSE latency)
    plan: starter       # Upgrade to standard for production
    branch: main

    # Build
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # Start — $PORT is injected by Render automatically
    startCommand: >
      streamlit run dashboard_v3/Home.py
      --server.port $PORT
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection true

    # Health check
    healthCheckPath: /
    healthCheckTimeout: 30

    # Auto-deploy on git push
    autoDeploy: true

    envVars:
      - key: SUPABASE_URL
        sync: false   # Set in Render dashboard > Environment
      - key: SUPABASE_KEY
        sync: false   # Anon/public key (safe for frontend)
      - key: GEMINI_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.10.12"

  # ============================================================
  # 2. BACKGROUND WORKER — LangGraph Sentinel Hive Daemon
  # ============================================================
  - name: sentinel-hive-worker
    type: worker
    env: python
    region: singapore
    plan: starter
    branch: main

    # Build
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt

    # Start — runs 24/7, respects market hours internally
    startCommand: python run_autonomous.py

    # Auto-deploy on git push
    autoDeploy: true

    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false   # Service Role Key — bypasses RLS, NEVER expose to frontend
      - key: GOOGLE_API_KEY
        sync: false   # Legacy naming support
      - key: GEMINI_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ZERODHA_API_KEY
        sync: false
      - key: ZERODHA_API_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: TZ
        value: "Asia/Kolkata"  # IST for market hours logic
